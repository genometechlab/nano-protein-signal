[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoclean"
version = "1.0.0"
description = "Modular multi-pass signal cleaning pipeline for nanopore trace data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "PyWavelets>=1.4",
    "numba>=0.57",
    "h5py>=3.8",
    "orjson>=3.8",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[project.scripts]
nanoclean = "nanoclean.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanoclean*"]

[tool.pytest.ini_options]
testpaths = ["nanoclean/test"]